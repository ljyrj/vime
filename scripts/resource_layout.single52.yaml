# [单机 52 拓扑] actor 训练 8 卡钉后八卡域 8-15(同一 HCCS 域,集合通信不跨 7/8 边界 → 免 EI0013 跨域 RoCE)。
# rollout 推理 4 卡钉 4-7(polar operator agent 独占 0-3,profile.vime.yaml npu_lease pool=[0-3])。
# 派生自 resource_layout_actor_domain2.yaml,节点改 80.48.5.88 → 80.48.5.52。
# 机制:placement 探测 12 卡(升序 visible 4-15)→ select_role_bundles 按 device 号分角色;
#   actor 绑 8-15;rollout 绑 4-7。保持 ASCEND_RT_VISIBLE_DEVICES 升序(Ascend 硬约束)。
# 用法:RESOURCE_LAYOUT=scripts/resource_layout.single52.yaml bash scripts/run-...single52.sh
# PD 分离时 rollout 4 卡拆 2 引擎(1P1D 各 TP2)由 num_gpus_per_engine + FEAT_PD_DISAGG 决定。
roles:
  actor:
    - {node: 80.48.5.52, devices: "8-15"}
  rollout:
    - {node: 80.48.5.52, devices: "4-7"}
rollout:
  num_gpus_per_engine: 4
